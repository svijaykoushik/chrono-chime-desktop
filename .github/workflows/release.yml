name: Release

# Build distributables and publish a GitHub Release when a version tag is pushed.
# Tag the commit (e.g. `git tag v2.0.0 && git push origin v2.0.0`) to trigger.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the release and upload assets

jobs:
  build:
    name: Build distributables (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # → Linux .deb
          - os: windows-latest # → Windows Squirrel .exe / .nupkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Make distributables
        run: npm run make

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: distributables-${{ matrix.os }}
          path: out/make/**
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all distributables
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release and attach distributables
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/**/*
